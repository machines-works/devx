# ALE Config for devx
# Generated by: ale init
# Place at: .claude/ale.config.yaml

project:
  name: "devx"
  description: "local proxy for portless local dev experience"

quality_gates:
  - name: "clippy"
    command: "cargo clippy -- -D warnings"
    when: "always"
  - name: "test"
    command: "cargo test"
    when: "always"

# Test framework for structured error parsing.
# Values: "jest" | "vitest" | "pytest" | "bats" | "go" | "auto"
# When "auto", agents detect from project files. See docs/ERROR-PARSING.md.
test_framework: "auto"

shared_files: []
  # Add files that multiple agents may edit concurrently:
  # - path: "src/routes.ts"
  #   strategy: "append"
  #   note: "Append new routes at end"

dev_environment:
  ports: {}
  rules: []
  start_command: ""
  stop_command: ""

auth:
  test_user: ""
  method: ""
  notes: ""
