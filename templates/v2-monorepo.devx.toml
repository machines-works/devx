# devx.toml — Sharpi v2-monorepo
# Replaces: make dev (infra + backend + frontend)
#
# Usage:
#   devx up              — start everything
#   devx up backend      — start backend + its dependencies
#   devx up frontend     — start frontend only

[project]
name = "sharpi-v2"

[infra]
compose = "docker-compose.dev.yml"

# ── Backend (Encore) ─────────────────────────────────────────
# [infra] compose is started automatically before any services
[services.backend]
cmd = "encore run"
dir = "backend"
port = 4000
domain = "api.localhost"
health = "http://localhost:${port}/healthz"
env = { TEMPORAL_ADDR = "localhost:7233" }

# ── Frontend (Next.js) ───────────────────────────────────────
[services.frontend]
cmd = "pnpm dev"
dir = "frontend"
port = 3000
domain = "web.localhost"
depends_on = ["backend"]

# ── Temporal UI (exposed from Docker) ────────────────────────
# Not a managed service — exposed by docker compose at :8233
# Access via: http://localhost:8233
