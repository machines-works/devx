# devx.toml — Sharpi v2-monorepo (with Docker infra)
#
# Uses docker compose for Temporal + Postgres.
# Prefer the non-Docker template unless you need persistent
# Temporal state or match the production Temporal setup.
#
# Usage:
#   devx up              — start everything (compose + services)
#   devx up backend      — start backend + its dependencies
#   devx up frontend     — start frontend only

[project]
name = "sharpi-v2"

[infra]
compose = "docker-compose.dev.yml"

# ── Backend (Encore) ─────────────────────────────────────────
# Encore auto-detected — devx injects --port. Encore manages its own Postgres.
# Temporal runs via docker compose at :7233, UI at :8233.
[services.backend]
cmd = "encore run"
dir = "backend"
port = 4000
domain = "api.localhost"
health = "http://localhost:${port}/healthz"
env = { TEMPORAL_ADDR = "localhost:7233" }

# ── Frontend (Next.js) ───────────────────────────────────────
# Next.js auto-detected — devx injects PORT env var.
[services.frontend]
cmd = "pnpm dev"
dir = "frontend"
port = 3000
domain = "web.localhost"
depends_on = ["backend"]
